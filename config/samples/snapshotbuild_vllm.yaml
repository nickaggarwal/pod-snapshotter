# Build a restorable checkpoint of a vLLM engine as a revision artifact.
#
# The build pod runs the real workload behind hack/snapshot-shim.py, which
# initializes the engine, releases the KV cache's physical pages, and parks in
# a poll loop. The operator checkpoints it there — before any socket is
# listening — and tears the pod down. Every 0->1 scale-up restores this one
# artifact (docs/design-v2.md §5).
#
# Quiescing is destructive: a replica parked in a poll loop is not serving.
# That is why this is a build and not a PodSnapshot of a live pod.
apiVersion: podsnapshot.io/v1alpha1
kind: SnapshotBuild
metadata:
  name: qwen14b
  namespace: default
spec:
  # Immutable; names the artifact directory under fuse:///snapshots/builds/.
  revision: qwen2.5-14b-instruct-v1
  # Directories are the default: expanded once here, never untarred again.
  artifactFormat: dir
  # Weight load + CUDA graph capture + dump + upload, end to end.
  timeoutSeconds: 3600
  podTemplate:
    metadata:
      annotations:
        podsnapshot.io/quiesce: "presence-file"
        podsnapshot.io/quiesce-dir: "/snapshot"
        podsnapshot.io/quiesce-timeout: "1800s"
    spec:
      nodeSelector:
        pool: gpuckpt
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.9.2
          # The shim wraps `vllm serve`; its arguments follow a bare --.
          command: ["python3", "-u", "/shim/snapshot-shim.py", "--quiesce-dir", "/snapshot", "--"]
          args:
            - --model=/mnt/fuse/models/Qwen2.5-14B-Instruct
            - --served-model-name=Qwen/Qwen2.5-14B-Instruct
            - --port=8000
            - --gpu-memory-utilization=0.90
            - --max-model-len=4096
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            # kubectl create configmap snapshot-shim \
            #   --from-file=snapshot-shim.py=hack/snapshot-shim.py
            - {name: shim, mountPath: /shim}
            # The rendezvous directory must be a writable volume: it is
            # captured in the image, and the agent writes restore-complete
            # into the restored pod's copy of it.
            - {name: snapshot, mountPath: /snapshot}
            - {name: fuse, mountPath: /mnt/fuse, mountPropagation: HostToContainer}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: shim, configMap: {name: snapshot-shim}}
        - {name: snapshot, emptyDir: {}}
        - {name: fuse, hostPath: {path: /mnt/fuse, type: Directory}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}
