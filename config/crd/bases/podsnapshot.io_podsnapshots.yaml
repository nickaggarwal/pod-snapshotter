---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: podsnapshots.podsnapshot.io
spec:
  group: podsnapshot.io
  names:
    kind: PodSnapshot
    listKind: PodSnapshotList
    plural: podsnapshots
    shortNames:
    - psnap
    singular: podsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .status.artifact.uri
      name: Artifact
      type: string
    - jsonPath: .status.artifact.sizeBytes
      name: Size
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PodSnapshot checkpoints a running (GPU) pod container into a
          tar artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodSnapshotSpec defines the desired state of PodSnapshot.
            properties:
              artifactURI:
                description: |-
                  ArtifactURI is where the checkpoint tar is stored. Supported schemes:
                    fuse:///<path>  — a path under the fuse-client mount (/mnt/fuse/<path> on nodes)
                    file:///<path>  — an absolute node-local path (testing only)
                  Defaults to fuse:///snapshots/<namespace>/<name>/<container>.tar
                type: string
              container:
                description: |-
                  Container to checkpoint. Defaults to the pod's only container; required
                  when the pod has more than one.
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the artifact when this
                  PodSnapshot is deleted: Retain (default) or Delete.
                enum:
                - Retain
                - Delete
                type: string
              podName:
                description: PodName is the name of the running pod (same namespace)
                  to checkpoint.
                minLength: 1
                type: string
              timeoutSeconds:
                default: 120
                description: |-
                  TimeoutSeconds for the kubelet checkpoint call. Large VRAM dumps take
                  minutes; default 120.
                format: int32
                minimum: 1
                type: integer
            required:
            - podName
            type: object
          status:
            description: PodSnapshotStatus defines the observed state of PodSnapshot.
            properties:
              artifact:
                description: Artifact describes the uploaded tar.
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  sha256:
                    type: string
                  sizeBytes:
                    format: int64
                    type: integer
                  uri:
                    type: string
                type: object
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              container:
                description: Container that was checkpointed (spec.container after
                  defaulting).
                type: string
              kubeletCheckpointPath:
                description: |-
                  KubeletCheckpointPath is the node-local tar written by the kubelet,
                  e.g. /var/lib/kubelet/checkpoints/checkpoint-<pod>_<ns>-<ctr>-<ts>.tar
                type: string
              message:
                description: Message holds a human-readable explanation of the current
                  phase.
                type: string
              nodeName:
                description: |-
                  NodeName is the node the checkpointed pod runs on; the agent there
                  performs the artifact upload.
                type: string
              phase:
                description: 'Phase: Pending | Checkpointing | Checkpointed | Uploading
                  | Completed | Failed'
                type: string
              podUID:
                description: PodUID of the checkpointed pod at snapshot time.
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
