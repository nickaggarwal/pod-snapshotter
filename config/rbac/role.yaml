---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-snapshotter-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/proxy
  verbs:
  - create
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - podsnapshot.io
  resources:
  - podrestores
  - podsnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - podsnapshot.io
  resources:
  - podrestores/finalizers
  - podsnapshots/finalizers
  verbs:
  - update
- apiGroups:
  - podsnapshot.io
  resources:
  - podrestores/status
  - podsnapshots/status
  verbs:
  - get
  - patch
  - update
