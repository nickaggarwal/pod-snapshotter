apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-snapshotter-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: pod-snapshotter-agent
spec:
  selector:
    matchLabels:
      app: pod-snapshotter-agent
  template:
    metadata:
      labels:
        app: pod-snapshotter-agent
    spec:
      serviceAccountName: pod-snapshotter-agent
      # hostPID: nsenter into the host mount namespace to run the node's
      # runc/criu/cuda-checkpoint; hostNetwork: reach fuse-client on
      # 127.0.0.1:8081.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --fuse-mount={{ .Values.agent.fuseMount }}
            - --checkpoints-dir={{ .Values.agent.checkpointsDir }}
            - --work-root={{ .Values.agent.workRoot }}
            - --cri-socket={{ .Values.agent.criSocket }}
            - --fuse-api-endpoint={{ .Values.agent.fuseAPIEndpoint }}
            - --fuse-agent-socket={{ .Values.agent.fuseAgentSocket }}
            - --host-root=/host
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: kubelet-checkpoints
              mountPath: {{ .Values.agent.checkpointsDir }}
            - name: fuse-mount
              mountPath: {{ .Values.agent.fuseMount }}
              mountPropagation: HostToContainer
            # Parent dir: covers workRoot (restores/) AND node-local file://
            # artifacts (artifacts/) so both survive agent pod restarts.
            - name: state-root
              mountPath: /var/lib/pod-snapshotter
            # Whole runtime dir (not just the socket): the restore path needs
            # the v2 task bundles' rootfs dirs for keeper rootfs resolution.
            - name: containerd-run
              mountPath: /run/containerd
              mountPropagation: HostToContainer
            - name: fuse-client-run
              mountPath: /var/run/fuse-client
            # Host /run (writable): restore recreates NVIDIA toolkit hook
            # files (/run/nvidia-ctk-hook<uuid>) at their checkpointed paths.
            - name: host-run
              mountPath: /host-run
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: HostToContainer
      volumes:
        - name: kubelet-checkpoints
          hostPath: {path: {{ .Values.agent.checkpointsDir }}, type: DirectoryOrCreate}
        - name: fuse-mount
          hostPath: {path: {{ .Values.agent.fuseMount }}, type: DirectoryOrCreate}
        - name: state-root
          hostPath: {path: /var/lib/pod-snapshotter, type: DirectoryOrCreate}
        - name: containerd-run
          hostPath: {path: /run/containerd, type: Directory}
        - name: fuse-client-run
          hostPath: {path: /var/run/fuse-client, type: DirectoryOrCreate}
        - name: host-run
          hostPath: {path: /run, type: Directory}
        - name: host-root
          hostPath: {path: /, type: Directory}
        - name: kubelet-pods
          hostPath: {path: /var/lib/kubelet/pods, type: Directory}
