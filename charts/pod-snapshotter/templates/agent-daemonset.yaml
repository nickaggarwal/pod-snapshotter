apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pod-snapshotter-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: pod-snapshotter-agent
spec:
  selector:
    matchLabels:
      app: pod-snapshotter-agent
  template:
    metadata:
      labels:
        app: pod-snapshotter-agent
    spec:
      serviceAccountName: pod-snapshotter-agent
      # hostPID: nsenter into the host mount namespace to run the node's
      # runc/criu/cuda-checkpoint; hostNetwork: reach fuse-client on
      # 127.0.0.1:8081.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ include "pod-snapshotter.image" (dict "img" .Values.agent.image "root" $) }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --fuse-mount={{ .Values.agent.fuseMount }}
            - --checkpoints-dir={{ .Values.agent.checkpointsDir }}
            - --work-root={{ .Values.agent.workRoot }}
            - --cri-socket={{ .Values.agent.criSocket }}
            - --fuse-api-endpoint={{ .Values.agent.fuseAPIEndpoint }}
            - --fuse-agent-socket={{ .Values.agent.fuseAgentSocket }}
            - --host-root=/host
            - --stage-image-local={{ .Values.agent.stageImageLocal }}
            - --prefetch-parallelism={{ .Values.agent.prefetchParallelism }}
            - --nvme-cache-root={{ .Values.agent.nvmeCacheRoot }}
            - --local-artifact-root={{ .Values.agent.localArtifactRoot }}
            - --digest-artifacts={{ .Values.agent.digestArtifacts }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: kubelet-checkpoints
              mountPath: {{ .Values.agent.checkpointsDir }}
            - name: fuse-mount
              mountPath: {{ .Values.agent.fuseMount }}
              mountPropagation: HostToContainer
            {{- with .Values.agent.localArtifactRoot }}
            # Node-local artifact tier, for file:// artifacts. This has to be
            # mounted at the SAME path it has on the host, not under /host:
            # `runc checkpoint` runs through nsenter in the host mount
            # namespace, so the --image-path the agent computes is resolved by
            # the host, while the agent's own reads of the same artifact are
            # resolved in the container. One path, or they are two different
            # directories that happen to share a name.
            - name: local-artifacts
              mountPath: {{ . }}
              mountPropagation: HostToContainer
            {{- end }}
            # Parent dir: covers workRoot (restores/) AND node-local file://
            # artifacts (artifacts/) so both survive agent pod restarts.
            - name: state-root
              mountPath: {{ dir .Values.agent.workRoot }}
            # Whole runtime dir (not just the socket): the restore path needs
            # the v2 task bundles' rootfs dirs for keeper rootfs resolution.
            - name: runtime-dir
              mountPath: {{ dir .Values.agent.criSocket }}
              mountPropagation: HostToContainer
            - name: fuse-client-run
              mountPath: /var/run/fuse-client
            - name: host-root
              mountPath: /host
              readOnly: true
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: HostToContainer
      volumes:
        - name: kubelet-checkpoints
          hostPath: {path: {{ .Values.agent.checkpointsDir }}, type: DirectoryOrCreate}
        - name: fuse-mount
          hostPath: {path: {{ .Values.agent.fuseMount }}, type: DirectoryOrCreate}
        {{- with .Values.agent.localArtifactRoot }}
        - name: local-artifacts
          hostPath: {path: {{ . }}, type: DirectoryOrCreate}
        {{- end }}
        - name: state-root
          hostPath: {path: {{ dir .Values.agent.workRoot }}, type: DirectoryOrCreate}
        - name: runtime-dir
          hostPath: {path: {{ dir .Values.agent.criSocket }}, type: Directory}
        - name: fuse-client-run
          hostPath: {path: /var/run/fuse-client, type: DirectoryOrCreate}
        - name: host-root
          hostPath: {path: /, type: Directory}
        - name: kubelet-pods
          hostPath: {path: /var/lib/kubelet/pods, type: Directory}
