nameOverride: ""
namespace: pod-snapshotter

manager:
  image:
    repository: pod-snapshotter/manager
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  leaderElect: false
  # Skip kubelet serving-cert verification (needed on clusters with
  # self-signed kubelet certs — the same trade-off metrics-server makes).
  kubeletInsecureTLS: true
  # Refuse to checkpoint pods on nodes whose agent has not reported
  # prerequisites ok (annotation podsnapshot.io/prereqs=ok).
  requireNodePrereqs: true
  # fuse-client HTTP API used for artifact existence checks and deletion.
  fuseAPIEndpoint: "http://fuse-client.fuse-system.svc.cluster.local:8081"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# Host prerequisite installer: a privileged DaemonSet (same node scope as the
# agent) that installs CRIU on each node via the distro package manager and
# writes /etc/criu/runc.conf. Disable if your node image already ships CRIU
# or you manage host config elsewhere.
nodeSetup:
  enabled: true
  image: busybox:1.36
  # NVIDIA's standalone checkpoint utility, installed on GPU nodes only.
  cudaCheckpointURL: https://github.com/NVIDIA/cuda-checkpoint/raw/main/bin/x86_64_Linux/cuda-checkpoint

# Patched CRIU (docs/design-v2.md §6b). Upstream v4.2.1 plus the restore
# read-path patches in hack/criu/patches: native AIO for the async page reads
# and a thread pool for memfd/shmem restore. Installed to /usr/local/sbin,
# beside the distro package rather than over it.
#
# Off by default: it changes the binary every checkpoint and restore on the
# node goes through. Set uninstall=true to remove it and fall back.
criu:
  enabled: false
  uninstall: false
  image:
    repository: pod-snapshotter/criu
    # Still ps4, deliberately. ps5 adds the two commits that finally put memfd
    # and shmem bytes on the AIO path (design-v2.md §6d) and is expected to be
    # the faster build -- but it has not been measured on hardware yet, and
    # this tag is what an existing install picks up on upgrade. Bump it after
    # CF-5/CF-6/CF-8/CF-9/CF-10 pass, not before.
    tag: v4.2.1-ps4
    pullPolicy: IfNotPresent

agent:
  image:
    repository: pod-snapshotter/agent
    tag: latest
    pullPolicy: IfNotPresent
  # Restrict the agent to GPU nodes by default. Set to {} to run everywhere
  # (e.g. CPU-only checkpoint trials on kind).
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  # Paths on the host.
  fuseMount: /mnt/fuse
  checkpointsDir: /var/lib/kubelet/checkpoints
  workRoot: /var/lib/pod-snapshotter/restores
  criSocket: /run/containerd/containerd.sock
  # fuse-client integration on each node.
  fuseAPIEndpoint: "http://127.0.0.1:8081"
  fuseAgentSocket: /var/run/fuse-client/agent.sock
  # Directory artifacts are restored in place through the fuse mount, so
  # pre-warm only has to pull their bytes into the node's NVMe tier — no copy.
  # Turn this on to copy them onto node-local storage instead, which is worth
  # measuring if the mount's per-read overhead beats the copy.
  stageImageLocal: false
  # fuse-client's node-local NVMe cache tier, as a path *on the host*. After
  # pre-warm the artifact is already on this device, and reading it back
  # through the FUSE mount costs ~7x (500-690 MB/s vs 2.6-4.5 GB/s measured
  # on A100 nodes), so the restore reads the CRIU images straight off it.
  #
  # Host path, not /host/...: runc is exec'd through nsenter into the host
  # mount namespace and resolves this there. The agent's own checks go
  # through its read-only /host mount, which it prepends itself.
  #
  # Guarded — the bypass is used only when the tier holds every manifest file
  # at the right size, otherwise the restore falls back to the mount. Empty
  # disables it entirely.
  nvmeCacheRoot: /mnt/fuse-nvme0n1/fuse-cache
  # Files fetched concurrently from a directory artifact (0 = built-in
  # default of 4). Tar artifacts are always a single stream.
  #
  # Measured throughput peaks at 4 and falls off after it, so this is not a
  # knob to turn up when restores are slow: 8 was both slower than 4 and the
  # setting under which fuse-client OOMKilled. See
  # internal/artifact/prefetch.go for the curve.
  prefetchParallelism: 0
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
