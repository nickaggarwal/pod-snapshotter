---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: podsnapshots.podsnapshot.io
spec:
  group: podsnapshot.io
  names:
    kind: PodSnapshot
    listKind: PodSnapshotList
    plural: podsnapshots
    shortNames:
    - psnap
    singular: podsnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .status.artifact.uri
      name: Artifact
      type: string
    - jsonPath: .status.artifact.format
      name: Format
      type: string
    - jsonPath: .status.artifact.sizeBytes
      name: Size
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PodSnapshot checkpoints a running (GPU) pod container into a
          tar artifact.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodSnapshotSpec defines the desired state of PodSnapshot.
            properties:
              artifactFormat:
                default: dir
                description: |-
                  ArtifactFormat selects the on-storage layout:

                    tar — one CRI checkpoint archive (v1 default; restore untars it)
                    dir — the archive expanded into per-file objects under a prefix,
                          committed by a MANIFEST written last. Restore reads the CRIU
                          images in place, so the untar disappears from the restore
                          critical path (docs/design-v2.md §3).

                  Ignored when artifactURI is set explicitly — the trailing slash decides.

                  Defaults to dir, which is what the default checkpointer (agent) needs:
                  asking for tar silently demotes the dump back to the kubelet path,
                  because there is no tar for the agent to hand back.
                enum:
                - tar
                - dir
                type: string
              artifactURI:
                description: |-
                  ArtifactURI is where the checkpoint is stored. Supported schemes:
                    fuse:///<path>  — a path under the fuse-client mount (/mnt/fuse/<path> on nodes)
                    file:///<path>  — an absolute node-local path (testing only)
                  A trailing slash makes it a directory prefix (artifactFormat: dir).
                  Defaults to <artifact-root>/<namespace>/<name>/<container>/, where the
                  root is the manager's --artifact-root (chart value
                  manager.artifactRoot, default fuse:///snapshots). Point that at a
                  file:// path on the node's NVMe to keep the network filesystem out of
                  the dump and restore paths entirely.
                type: string
              checkpointer:
                default: agent
                description: |-
                  Checkpointer selects who runs the dump:

                    agent   — (default) the node agent runs `runc checkpoint` itself,
                              with CRIU writing its images straight into the artifact
                              directory.
                    kubelet — POST to the kubelet checkpoint API, which drives CRIU and
                              hands back a tar. The agent then expands that tar into the
                              artifact directory.

                  The two produce the same artifact. What differs is how many times the
                  bytes are written to get there: the kubelet path writes them into a
                  tar and reads them back out, so a 56 GB checkpoint moves roughly three
                  times that much I/O, most of it on whichever disk holds
                  /var/lib/kubelet — the OS disk on a stock AKS GPU node, not the NVMe
                  tier the artifact is bound for. See docs/design-v2.md §3.

                  Measured on an A100 node, Qwen2.5-14B, 56 GB of images, both arms
                  writing to the same node NVMe: kubelet 1279 s, agent 297 s. Of the
                  kubelet arm's extra time, ~793 s is building the tar and 156 s is
                  expanding it again — the archive is the cost, not CRIU (docs/design-v2.md
                  §3).

                  agent requires artifactFormat: dir (there is no tar to hand back). It
                  falls back to kubelet, with the reason in the snapshot's status, when
                  the artifact is a tar or the node's agent is too old to advertise the
                  capability — which is what makes it safe as a default on a cluster
                  that is mid-upgrade.
                enum:
                - kubelet
                - agent
                type: string
              container:
                description: |-
                  Container to checkpoint. Defaults to the pod's only container; required
                  when the pod has more than one.
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the artifact when this
                  PodSnapshot is deleted: Retain (default) or Delete.
                enum:
                - Retain
                - Delete
                type: string
              podName:
                description: PodName is the name of the running pod (same namespace)
                  to checkpoint.
                minLength: 1
                type: string
              timeoutSeconds:
                default: 120
                description: |-
                  TimeoutSeconds for the checkpoint. Large VRAM dumps take minutes;
                  default 120.
                format: int32
                minimum: 1
                type: integer
            required:
            - podName
            type: object
          status:
            description: PodSnapshotStatus defines the observed state of PodSnapshot.
            properties:
              artifact:
                description: Artifact describes the uploaded checkpoint.
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  fileCount:
                    description: FileCount is the number of objects in a directory
                      artifact.
                    format: int32
                    type: integer
                  format:
                    description: |-
                      Format is "tar" or "dir"; absent means "tar" so v1 artifacts and the
                      PodRestores pointing at them keep working unchanged.
                    type: string
                  sha256:
                    description: |-
                      SHA256 of the tar. Empty for directory artifacts — their per-file
                      digests live in the MANIFEST.
                    type: string
                  sizeBytes:
                    format: int64
                    type: integer
                  uri:
                    type: string
                type: object
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              container:
                description: Container that was checkpointed (spec.container after
                  defaulting).
                type: string
              kubeletCheckpointPath:
                description: |-
                  KubeletCheckpointPath is the node-local tar written by the kubelet,
                  e.g. /var/lib/kubelet/checkpoints/checkpoint-<pod>_<ns>-<ctr>-<ts>.tar
                type: string
              message:
                description: Message holds a human-readable explanation of the current
                  phase.
                type: string
              nodeName:
                description: |-
                  NodeName is the node the checkpointed pod runs on; the agent there
                  performs the artifact upload.
                type: string
              phase:
                description: 'Phase: Pending | Checkpointing | Checkpointed | Uploading
                  | Completed | Failed'
                type: string
              podUID:
                description: PodUID of the checkpointed pod at snapshot time.
                type: string
              quiesce:
                description: Quiesce is set when the target pod opted into the quiesce
                  protocol.
                properties:
                  deadline:
                    description: Deadline is when the wait for ready-for-checkpoint
                      gives up.
                    format: date-time
                    type: string
                  dir:
                    description: Dir is the in-container rendezvous directory.
                    type: string
                  mode:
                    description: Mode is the protocol in use ("presence-file").
                    type: string
                  readyAt:
                    description: ReadyAt is when the presence file appeared.
                    format: date-time
                    type: string
                type: object
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
